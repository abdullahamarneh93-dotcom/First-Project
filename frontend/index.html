<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fw-bold">Expense Tracker</span>
    </div>
  </nav>

  <div class="container mb-5">
    <div id="alertContainer"></div>

    <div class="row g-3 mb-4 text-center">
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 py-3">
          <div class="card-body">
            <h6 class="text-secondary fw-semibold mb-2">Total</h6>
            <h2 class="card-title fw-bold text-dark m-0" id="totalAmount">0.00</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 py-3">
          <div class="card-body">
            <h6 class="text-secondary fw-semibold mb-2">Number of expenses</h6>
            <h2 class="card-title fw-bold text-dark m-0" id="expensesCount">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 py-3">
          <div class="card-body">
            <h6 class="text-secondary fw-semibold mb-2">Highest expense</h6>
            <h2 class="card-title fw-bold text-dark m-0" id="highestAmount">0.00</h2>
            <small class="text-muted d-block mt-1" id="highestTitle">-</small>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-3">Add expense</h5>
        <form id="addExpenseForm" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label text-muted small fw-bold">Title</label>
            <input type="text" class="form-control" id="title" placeholder="Lunch" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small fw-bold">Amount</label>
            <input type="number" step="0.01" class="form-control" id="amount" placeholder="4.50" required>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small fw-bold">Category</label>
            <select class="form-select" id="category" required>
              <option value="" disabled selected>Choose...</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small fw-bold">Date</label>
            <input type="date" class="form-control" id="date" required>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add expense</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="fw-bold m-0">Expenses</h5>
          <div class="d-flex align-items-center gap-2">
            <span class="text-muted small fw-bold">Category</span>
            <select class="form-select form-select-sm w-auto" id="filterCategory">
              <option value="All" selected>All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="loadingSpinner" class="text-center py-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-borderless align-middle m-0" id="expensesTable">
            <thead>
              <tr class="border-bottom">
                <th scope="col" class="fw-bold">Title</th>
                <th scope="col" class="fw-bold text-end">Amount</th>
                <th scope="col" class="fw-bold">Category</th>
                <th scope="col" class="fw-bold">Date</th>
                <th scope="col" class="fw-bold text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editExpenseForm">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Title</label>
              <input type="text" class="form-control" id="editTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Amount</label>
              <input type="number" step="0.01" class="form-control" id="editAmount" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Category</label>
              <select class="form-select" id="editCategory" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Date</label>
              <input type="date" class="form-control" id="editDate" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
